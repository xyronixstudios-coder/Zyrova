name: zyrova
description: "Akıcı bir akış. Akıllı cache."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_android_video: ^1.3.8

  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  supabase_flutter: ^2.5.0
  url_launcher: ^6.2.5
  provider: ^6.1.2
  emoji_picker_flutter: ^2.2.0
  app_links: ^7.2.1
  video_thumbnail: ^0.5.3
  screenshot: ^3.0.0
  share_plus: ^7.2.2
  file_picker: 8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  jni: 0.14.2
  path_provider_android: 2.2.15
  jni_flutter: 1.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
